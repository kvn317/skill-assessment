name: apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle assembleDebug
      # Shows exactly what Android Auto sees (service, intent filters, car metadata) in the build log.
      - run: $(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2 dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: irl-game-maps-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Public direct link: /releases/latest/download/irl-game-maps.apk
      - run: cp app/build/outputs/apk/debug/app-debug.apk irl-game-maps.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: IRL Game Maps (latest build)
          body: "Built from ${{ github.sha }}. Install irl-game-maps.apk on your phone."
          files: irl-game-maps.apk
          make_latest: true
